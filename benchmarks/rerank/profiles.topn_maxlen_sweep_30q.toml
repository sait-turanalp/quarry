# Top-N / max_length sweep for Jina v1 on 30-query set.
# baseline_current_default is auto-added by quarry benchmark-rerank.

[defaults]
model = "JINARerankerV1TurboEn"
timeout_ms = 15000
max_length = 1024
top_n = 30
top_k_vector = 100
top_k_bm25 = 100
top_k_fused = 50
rerank_score_normalization = "none"
post_rerank_heuristics_enabled = false
runtime_tuning_enabled = false
batch_size = 0
warmup_pairs = 0

[[profiles]]
name = "jina_tn30_heur_off"
top_n = 30
max_length = 1024
post_rerank_heuristics_enabled = false

[[profiles]]
name = "jina_tn20_len512_heur_off"
top_n = 20
max_length = 512
post_rerank_heuristics_enabled = false

[[profiles]]
name = "jina_tn15_len384_heur_off"
top_n = 15
max_length = 384
post_rerank_heuristics_enabled = false
